sheets.msg=()=>['A little note','For you',`<div style="text-align:center;padding:18px 0 10px"><div class="hrt">♥</div><div class="big" style="font-size:52px;margin-top:14px">I love you Omale</div></div>`];
$('#mb').onclick=()=>open('msg');
const sh=$('#sheet');
function open(k){const [e,t,b]=sheets[k]();$('#eb').textContent=e;$('#ht').textContent=t;$('#sb').innerHTML=b;$('#sb').scrollTop=0;sh.classList.add('on')}
document.querySelectorAll('.hs').forEach(b=>b.addEventListener('click',()=>{if(moved<7)open(b.dataset.k)}));
$('#cl').onclick=()=>sh.classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')sh.classList.remove('on')});
let th=null;try{th=localStorage.getItem('th')}catch(e){}
if(th)document.documentElement.dataset.theme=th;
$('#tg').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#2a2320';r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(e){}};
</script></body></html>
